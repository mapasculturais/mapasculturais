openapi: 3.1.0

info:
  title: API pública do Mapas Culturais
  version: "2026-09-05"
  summary: Leitura pública de Agentes, Eventos, Espaços, Projetos e Oportunidades.
  description: |
    API de leitura pública do Mapas Culturais. Não exige chave nem cadastro para
    consultar dados públicos.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /
    description: Esta instalação

tags:
  - name: Agentes
    description: Pessoas e organizações do campo cultural.
  - name: Eventos
    description: Programação cultural, com suas ocorrências de data, hora e local.
  - name: Espaços
    description: Equipamentos e locais culturais.
  - name: Projetos
    description: Iniciativas e programas culturais.
  - name: Oportunidades
    description: Editais, chamadas e prêmios.
  - name: Apoio
    description: Vocabulários e informações da instalação.

paths:
  /api/agent/describe:
    get:
      tags: [Agentes]
      operationId: describeAgents
      summary: Descreve todos os campos de agentes
      description: |
        Inventário completo dos campos desta instalação: propriedades, metadados e
        relações, cada um com tipo e rótulo. É o ponto de partida para descobrir o
        que pedir em `@select` e o que filtrar.

        Lista o modelo de dados completo. Campos de dado pessoal constam aqui, mas
        não são retornados nas consultas.
      responses:
        '200':
          description: Mapa de campo para definição.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/DefinicaoDeCampo'

  /api/agent/filters:
    get:
      tags: [Agentes]
      operationId: filtersAgents
      summary: Campos de seleção e taxonomias de agentes
      description: |
        Devolve `metadata` (os campos de escolha, com suas opções) e `taxonomies`
        (os vocabulários controlados). É a lista adequada para montar uma interface
        de busca.
      responses:
        '200':
          description: Filtros disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                  taxonomies:
                    type: object

  /api/agent/getTypes:
    get:
      tags: [Agentes]
      operationId: getAgentsTypes
      summary: Tipos de agentes
      description: |
        Os ids de tipo variam por instalação. É a fonte dos valores do filtro `type`.
      responses:
        '200':
          description: Lista de tipos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tipo'

  /api/agent/getTypeGroups:
    get:
      tags: [Agentes]
      operationId: getAgentsTypeGroups
      summary: Grupos de tipos de agentes
      responses:
        '200':
          description: Grupos de tipos.
          content:
            application/json:
              schema:
                type: object

  /api/agent/find:
    get:
      tags: [Agentes]
      operationId: findAgents
      summary: Lista agentes
      description: |
        Devolve um array de agentes públicos.
        Sem `@select`, cada registro traz apenas o `id`.

        O total e a paginação vêm no cabeçalho `API-Metadata`.

        Dados pessoais — documentos, contatos privados, data de nascimento e
        marcadores demográficos — não são retornados.

        O endereço só é retornado quando o agente ligou `publicLocation`.

        Filtros são pares `campo=OPERADOR(valor)` na query string, aplicáveis a
        qualquer campo listado em `/api/agent/describe`. Os abaixo são os mais usados.

        Operadores: `EQ`, `IN`, `IIN`, `LIKE`, `ILIKE`, `GT`, `GTE`, `LT`, `LTE`,
        `BET`, `NULL`, `AND`, `OR`, `GEONEAR`, `GEOBOUNDING`. Para negar, prefixe o
        operador com `!` — `!EQ(...)`, `!IN(...)`, `!NULL()`.

        Vários filtros combinam com **E**; `@or=1` troca para **OU**.

        Para recortar por entidade relacionada, filtre pelo id da relação:
        `owner=EQ(19647)` ou `owner=IN(19647,107829)`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Seals'
        - $ref: '#/components/parameters/Verified'
        - $ref: '#/components/parameters/Or'
        - $ref: '#/components/parameters/Formato'
        - $ref: '#/components/parameters/FiltroSubsite'
        - $ref: '#/components/parameters/FiltroId'
        - $ref: '#/components/parameters/FiltroNome'
        - name: publicLocation
          in: query
          description: Se o agente publicou a própria localização. Só nesses o endereço vem preenchido.
          schema:
            type: string
            examples:
              - 'EQ(true)'
        - name: En_Estado
          in: query
          description: Unidade federativa do endereço, quando público.
          schema:
            type: string
            examples:
              - 'EQ(BA)'
              - 'IN(BA,SE)'
        - name: En_Municipio
          in: query
          description: Município do endereço, quando público.
          schema:
            type: string
            examples:
              - 'EQ(Salvador)'
        - name: type
          in: query
          description: Tipo de agente. Os ids vêm de `/api/agent/getTypes`.
          schema:
            type: string
            examples:
              - 'EQ(1)'
              - 'IN(1,2)'
      responses:
        '200':
          description: |
            Array de agentes públicos.
          headers:
            API-Metadata:
              $ref: '#/components/headers/ApiMetadata'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Cors'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              examples:
                exemplo:
                  value:
                  - id: 1
                    name: Secretaria de Cidadania e Diversidade Cultural
                    En_Municipio: Brasília
                    En_Estado: DF
                    '@entityType': agent

  /api/agent/findOne:
    get:
      tags: [Agentes]
      operationId: findOneAgent
      summary: Devolve um agente
      description: |
        Mesma linguagem de consulta de `find`, limitada ao primeiro resultado.
        Devolve o objeto, ou `null` quando nada casa.
      parameters:
