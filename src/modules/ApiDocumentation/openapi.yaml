  /api/term/list/{taxonomia}:
    get:
      tags: [Apoio]
      operationId: listTerms
      summary: Termos válidos de um vocabulário
      description: |
        A taxonomia vai **no caminho**, não na query string: `/api/term/list/area`
        funciona, `/api/term/list?taxonomy=area` não.

        Os termos daqui são os valores aceitos pelo filtro `term:{taxonomia}` nas
        consultas de entidade — por exemplo `term:area=EQ(Gestão Cultural)`.
      parameters:
        - name: taxonomia
          in: path
          required: true
          description: Slug do vocabulário.
          schema:
            type: string
            examples:
              - area
              - tag
              - linguagem
      responses:
        '200':
          description: Termos do vocabulário.
          content:
            application/json:
              schema:
                type: array
