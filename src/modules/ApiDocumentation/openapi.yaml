  /api/space/find:
    get:
      tags: [Espaços]
      operationId: findSpaces
      summary: Lista espaços
      description: |
        Devolve um array de espaços públicos.
        Sem `@select`, cada registro traz apenas o `id`.

        O total e a paginação vêm no cabeçalho `API-Metadata`.

        Diferente de agente, **o endereço do espaço é público**, sem condicional —
        espaço é local físico e o endereço é parte do que se publica.

        Filtros são pares `campo=OPERADOR(valor)` na query string, aplicáveis a
        qualquer campo listado em `/api/space/describe`. Os abaixo são os mais usados.

        Operadores: `EQ`, `IN`, `IIN`, `LIKE`, `ILIKE`, `GT`, `GTE`, `LT`, `LTE`,
        `BET`, `NULL`, `AND`, `OR`, `GEONEAR`, `GEOBOUNDING`. Para negar, prefixe o
        operador com `!` — `!EQ(...)`, `!IN(...)`, `!NULL()`.

        Vários filtros combinam com **E**; `@or=1` troca para **OU**.

        Para recortar por entidade relacionada, filtre pelo id da relação:
        `owner=EQ(19647)` ou `owner=IN(19647,107829)`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Seals'
        - $ref: '#/components/parameters/Verified'
        - $ref: '#/components/parameters/Or'
        - $ref: '#/components/parameters/Formato'
        - $ref: '#/components/parameters/FiltroSubsite'
        - $ref: '#/components/parameters/FiltroId'
        - $ref: '#/components/parameters/FiltroNome'
        - name: En_Estado
          in: query
          description: Unidade federativa do endereço.
          schema:
            type: string
            examples:
              - 'EQ(RJ)'
              - 'IN(RJ,SP)'
        - name: En_Municipio
          in: query
          description: Município do endereço.
          schema:
            type: string
            examples:
              - 'EQ(Niterói)'
        - name: acessibilidade
          in: query
          description: Recursos de acessibilidade declarados.
          schema:
            type: string
            examples:
              - '!NULL()'
        - name: type
          in: query
          description: Tipo de espaço. Os ids vêm de `/api/space/getTypes`.
          schema:
            type: string
            examples:
              - 'EQ(20)'
      responses:
        '200':
          description: |
            Array de espaços públicos.
          headers:
            API-Metadata:
              $ref: '#/components/headers/ApiMetadata'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Cors'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
              examples:
                exemplo:
                  value:
                  - id: 6296
                    name: Galeria de Arte La Salle
                    En_CEP: 24240-030
                    En_Municipio: Niterói
                    En_Estado: RJ
                    '@entityType': space

