        singleUrl:
          type: string
          description: URL da página pública do registro.
        createTimestamp:
          type: string
        updateTimestamp:
          type: string
        '@entityType':
          type: string
          const: opportunity
        registrationFrom:
          type: string
          description: Abertura das inscrições.
        registrationTo:
          type: string
          description: Encerramento das inscrições.
        publishedRegistrations:
          type: boolean
          description: Se o resultado da seleção foi publicado.
        registrationCategories:
          type: array
