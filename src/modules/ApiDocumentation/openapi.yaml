  /api/site/info:
    get:
      tags: [Apoio]
      operationId: siteInfo
      summary: Descrição da instalação e contagens globais
      responses:
        '200':
          description: Informações da instalação.
          content:
            application/json:
              schema:
                type: object

components:

  headers:

    ApiMetadata:
      description: |
        Total de registros e estado da paginação, em JSON. É aqui que se lê o total,
        não no corpo.
      schema:
        type: string
      example: '{"count":187570,"page":1,"limit":50,"numPages":3752,"keyword":"","order":""}'

    Cors:
      description: Política de origem cruzada da instalação.
      schema:
        type: string
      example: '*'

  parameters:

    Select:
      name: '@select'
      in: query
      required: false
      description: |
        Campos a devolver, separados por vírgula. **Sem este parâmetro a resposta
        traz só o `id`.**

        Aceita metadados como campos comuns (`En_Municipio`), navegação por relação
        com ponto e chaves (`owner.{id,name}`) e campos compostos (`terms`, `files`,
        `type`, `singleUrl`, `location`).

        Uma relação vem `null` quando a entidade relacionada não é pública.
      schema:
        type: string
        examples:
          - id,name,shortDescription
          - id,name,owner.{id,name}
          - id,name,terms,type,singleUrl

    Order:
      name: '@order'
      in: query
      required: false
      description: Ordenação. Aceita `ASC`/`DESC` e vários campos separados por vírgula.
      schema:
        type: string
        examples:
          - name ASC
          - createTimestamp DESC

    Limit:
      name: '@limit'
      in: query
      required: false
      description: |
        Quantidade de registros por página. Sem este parâmetro a consulta devolve o
        conjunto inteiro.
      schema:
        type: integer
        minimum: 1
        default: 100

    Page:
      name: '@page'
      in: query
      required: false
      description: Página, contada a partir de 1. Só tem efeito junto com `@limit`.
      schema:
        type: integer
        minimum: 1

    Offset:
      name: '@offset'
      in: query
      required: false
      description: Deslocamento direto, alternativa a `@page`.
      schema:
        type: integer
        minimum: 0

    Count:
      name: '@count'
      in: query
      required: false
      description: |
        Devolve apenas o número total de registros, sem os dados. Use para dimensionar
        uma varredura antes de executá-la.
      schema:
        type: string
        examples:
          - '1'

    Keyword:
      name: '@keyword'
      in: query
      required: false
      description: Busca textual livre. Vários termos separados por ponto e vírgula.
      schema:
        type: string

    Seals:
      name: '@seals'
      in: query
      required: false
      description: |
        Filtra por selo. Aceita um id, uma lista separada por vírgula ou `IN(...)`.

        Os ids de selo variam por instalação.
      schema:
        type: string
        examples:
          - '6'
          - '6,101'
          - IN(6,101)

    Verified:
      name: '@verified'
      in: query
      required: false
      description: |
        Atalho para os selos que a instalação considera verificadores.
      schema:
        type: string
        examples:
          - '1'

    Or:
      name: '@or'
      in: query
      required: false
      description: Combina os filtros com **OU** em vez de **E**, que é o padrão.
      schema:
        type: string
        examples:
          - '1'

    Formato:
      name: '@type'
      in: query
      required: false
      description: |
        Formato da resposta. Omitido, é `json`.
      schema:
        type: string
        enum: [json, html, excel, texttable]
        default: json

    FiltroSubsite:
      name: subsite
      in: query
      required: false
      description: |
        Recorte por site de origem. Declare quando o escopo for um site específico.

        `NULL()` traz os registros criados no site principal, sem subsite de origem.

        Para descobrir o id de um site, peça `subsite` no `@select` — por exemplo
        `/api/agent/find?@select=id,name,subsite`.
      schema:
        type: string
        examples:
          - EQ(4)
          - IN(4,8)
          - NULL()

    FiltroId:
      name: id
      in: query
      required: false
      description: Filtro pelo identificador do registro.
      schema:
        type: string
        examples:
          - EQ(42)
          - IN(1,2,3)
          - BET(1,100)

    FiltroNome:
      name: name
      in: query
      required: false
      description: |
        Filtro pelo nome. `ILIKE` ignora acento e caixa; `LIKE` ignora acento mas
        diferencia maiúscula. O curinga é `*`.
      schema:
        type: string
        examples:
          - ILIKE(*cultural*)
          - EQ(Casa de Cultura)

  schemas:

    Tipo:
      type: object
      title: Tipo
      properties:
        id:
          type: integer
        name:
          type: string

    DefinicaoDeCampo:
      type: object
      description: Definição de um campo, como devolvida por `describe`.
      properties:
        label:
          type: string
          description: Rótulo de exibição.
        type:
          type: string
        isMetadata:
          type: boolean
          description: Se é metadado, e não coluna da entidade.
        isEntityRelation:
          type: boolean
          description: Se aponta para outra entidade — navegável em `@select` com ponto.
        targetEntity:
          type: string
          description: Entidade de destino, quando é relação.
        required:
          type: boolean
        length:
          type: integer
        options:
          description: Valores aceitos, quando é campo de escolha.
        private:
          type: boolean
          description: |
            Campo de dado pessoal, não retornado nas consultas.

    Agent:
      type: object
      title: Agente
      description: |
        Pessoa ou organização. Dados pessoais — documentos, contatos privados,
        data de nascimento, marcadores demográficos — não são retornados.
      properties:
        id:
          type: integer
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        type:
          description: Tipo do registro; objeto quando pedido em `@select`.
        status:
          type: integer
          description: Registros públicos têm status maior que zero.
        subsite:
          description: Subsite de origem; `null` quando criado no site principal.
        terms:
          type: object
          description: Taxonomias, agrupadas por vocabulário.
        singleUrl:
          type: string
          description: URL da página pública do registro.
        createTimestamp:
          type: string
        updateTimestamp:
          type: string
        '@entityType':
          type: string
          const: agent
        publicLocation:
          type: boolean
          description: |
            Quando falso, endereço e coordenadas não são retornados. Filtre com
            `publicLocation=EQ(true)` para obter só quem publicou a localização.
        location:
          $ref: '#/components/schemas/Ponto'
        emailPublico:
          type: string
        telefonePublico:
          type: string
        En_Municipio:
          type: string
          description: Só preenchido quando `publicLocation` é verdadeiro.
        En_Estado:
          type: string
          description: Só preenchido quando `publicLocation` é verdadeiro.
        site:
          type: string
        instagram:
          type: string
        facebook:
          type: string
    Event:
      type: object
      title: Evento
      properties:
        id:
          type: integer
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        type:
          description: Tipo do registro; objeto quando pedido em `@select`.
        status:
          type: integer
          description: Registros públicos têm status maior que zero.
        subsite:
          description: Subsite de origem; `null` quando criado no site principal.
        terms:
          type: object
          description: Taxonomias, agrupadas por vocabulário.
        singleUrl:
          type: string
          description: URL da página pública do registro.
        createTimestamp:
          type: string
        updateTimestamp:
          type: string
        '@entityType':
          type: string
