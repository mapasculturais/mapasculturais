    Ponto:
      type: object
      title: Ponto geográfico
      description: |
        Coordenadas. Vem zerado quando a localização não é pública.

        Filtre por proximidade com `location=GEONEAR(longitude,latitude,raio_em_metros)`
        — a longitude vem antes da latitude — ou por retângulo com
        `location=GEOBOUNDING([lng1,lat1],[lng2,lat2])`.


      properties:
        latitude:
          type: number
        longitude:
          type: number
