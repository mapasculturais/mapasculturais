  /api/opportunity/find:
    get:
      tags: [Oportunidades]
      operationId: findOpportunities
      summary: Lista oportunidades
      description: |
        Devolve um array de oportunidades públicas.
        Sem `@select`, cada registro traz apenas o `id`.

        O total e a paginação vêm no cabeçalho `API-Metadata`.

        `registrationFrom` e `registrationTo` delimitam o período de inscrição — é o
        par a usar para listar editais abertos.

        As inscrições em si não são públicas. `publishedRegistrations` indica que o
        organizador divulgou o resultado da seleção.

        Filtros são pares `campo=OPERADOR(valor)` na query string, aplicáveis a
        qualquer campo listado em `/api/opportunity/describe`. Os abaixo são os mais usados.

        Operadores: `EQ`, `IN`, `IIN`, `LIKE`, `ILIKE`, `GT`, `GTE`, `LT`, `LTE`,
        `BET`, `NULL`, `AND`, `OR`, `GEONEAR`, `GEOBOUNDING`. Para negar, prefixe o
        operador com `!` — `!EQ(...)`, `!IN(...)`, `!NULL()`.

        Vários filtros combinam com **E**; `@or=1` troca para **OU**.

        Para recortar por entidade relacionada, filtre pelo id da relação:
        `owner=EQ(19647)` ou `owner=IN(19647,107829)`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Seals'
        - $ref: '#/components/parameters/Verified'
        - $ref: '#/components/parameters/Or'
        - $ref: '#/components/parameters/Formato'
        - $ref: '#/components/parameters/FiltroSubsite'
        - $ref: '#/components/parameters/FiltroId'
        - $ref: '#/components/parameters/FiltroNome'
        - name: registrationFrom
          in: query
          description: Abertura das inscrições.
          schema:
            type: string
            examples:
              - 'LTE(2026-09-05)'
        - name: registrationTo
          in: query
          description: Encerramento das inscrições.
          schema:
            type: string
            examples:
              - 'GTE(2026-09-05)'
        - name: publishedRegistrations
          in: query
          description: Se o resultado da seleção foi divulgado.
          schema:
            type: string
            examples:
              - 'EQ(true)'
        - name: continuousFlow
          in: query
          description: Fluxo contínuo, sem data de encerramento.
          schema:
            type: string
            examples:
              - 'EQ(true)'
        - name: type
          in: query
          description: Tipo de oportunidade. Os ids vêm de `/api/opportunity/getTypes`.
          schema:
            type: string
            examples:
              - 'EQ(1)'
      responses:
        '200':
          description: |
            Array de oportunidades públicas.
          headers:
            API-Metadata:
              $ref: '#/components/headers/ApiMetadata'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Cors'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opportunity'
              examples:
                exemplo:
                  value:
                  - id: 77
                    name: Prêmio Culturas Populares
                    registrationFrom: '2026-08-01 00:00:00'
                    registrationTo: '2026-09-30 23:59:59'
                    '@entityType': opportunity

  /api/opportunity/findOne:
    get:
      tags: [Oportunidades]
      operationId: findOneOpportunitie
      summary: Devolve uma oportunidade
      description: |
        Mesma linguagem de consulta de `find`, limitada ao primeiro resultado.
        Devolve o objeto, ou `null` quando nada casa.
      parameters:
