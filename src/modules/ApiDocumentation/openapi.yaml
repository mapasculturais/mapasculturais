        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Formato'
        - $ref: '#/components/parameters/FiltroSubsite'
        - $ref: '#/components/parameters/FiltroId'
        - $ref: '#/components/parameters/FiltroNome'
        - name: publicLocation
          in: query
          description: Se o agente publicou a própria localização. Só nesses o endereço vem preenchido.
          schema:
            type: string
            examples:
              - 'EQ(true)'
        - name: En_Estado
          in: query
          description: Unidade federativa do endereço, quando público.
          schema:
            type: string
            examples:
              - 'EQ(BA)'
              - 'IN(BA,SE)'
        - name: En_Municipio
          in: query
          description: Município do endereço, quando público.
          schema:
            type: string
            examples:
              - 'EQ(Salvador)'
        - name: type
          in: query
          description: Tipo de agente. Os ids vêm de `/api/agent/getTypes`.
          schema:
            type: string
            examples:
              - 'EQ(1)'
              - 'IN(1,2)'
      responses:
        '200':
          description: |
            Um agente encontrado, ou `null`.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Cors'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Agent'
                  - type: 'null'

  /api/agent/getChildrenIds/id:{id}:
    get:
      tags: [Agentes]
      operationId: getAgentsChildrenIds
      summary: Ids dos agentes filhos
      description: |
        Ids dos registros filhos na hierarquia. Array vazio quando não há filhos.
      parameters:
